[project]
name = "paper-cli"
version = "3.11.2+open"
description = "文献调研系统 CLI"
license = { text = "AGPL-3.0-only" }
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
  "flask==3.1.3",
  "flask-cors==6.0.2",
  "python-dotenv==1.2.2",
  "pymupdf==1.27.2.2",
  "pillow==12.1.1",
  "fastmcp==3.4.7",
  "uvicorn==0.52.4",
  "gunicorn==25.2.0",
  "requests==2.32.5",
  "numpy==2.4.3",
]

[project.scripts]
paper = "backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["db/schema.sql", "db/migrations/*.py"]
